listen:
  webhook: ":8080"
  syslog_udp: ":5514"
  syslog_tcp: ":5514"
  admin: ":9090"

links:
  grafana: "https://grafana.example.com/d/abc/notrouter"
  runbook: ""
  github: ""

auth:
  admin:
    # Username for legacy basic auth on /admin/state, /admin/deliveries,
    # /admin/dedup/clear. The web UI password is managed in creds_path.
    username: admin

    # Persisted credentials file. First run seeds it with admin/admin and
    # MustChange=true; the UI forces a password rotation on first login.
    # OIDC client config will land here in a future iteration.
    creds_path: /var/lib/notrouter/creds.json

    # Web UI session length. After this, users must log in again.
    session_ttl: 2h

receivers:
  webhook:
    endpoints:
      - path: /webhook/nagios
        profile: nagios
      - path: /webhook/generic
        profile: generic
  syslog:
    early_filter:
      enabled: false
      case_insensitive: false       # default; firewall codes are case-stable
      log_interval: 10m             # optional; defaults to 10min
      include_patterns:
        # Order matters - put high-volume patterns FIRST. Match returns
        # on first hit. After the first 10-min summary, re-order by hit
        # count so the cheapest patterns short-circuit early.
        - "Failed login"
  smtp:
    port_25:
      enabled: true
      listen: ":2525"
      hostname: "notrouter.local"
      allowed_ips:
        - "127.0.0.1/32"        # loopback
        - "172.16.0.0/12"       # private range
        - "10.0.0.0/8"          # private range
        - "192.168.0.0/16"      # private range
      allowed_rcpt_to:
        - "alerts@notrouter.local"
      allowed_from: []
      max_message_bytes: 1048576

trace:
  enabled: true
  output_dir: /var/log/notrouter/trace
  reminder_interval: 1h
  receivers:
    smtp:
      enabled: true
      max_files: 50
    syslog_udp:
      enabled: false
      max_bytes_per_file: 10485760
      max_files: 3
    syslog_tcp:
      enabled: false
      max_bytes_per_file: 10485760
      max_files: 3
    webhook:
      enabled: false
      max_bytes_per_file: 10485760
      max_files: 3

# mail_parsers defines vendor-specific parsing for inbound SMTP events.
# Each parser:
#   - has a Match condition (subject_prefix is the strongest discriminator)
#   - runs a sequence of extractors on a matched event
#   - returns a profile name; the matched profile's normalize/attributes
#     rules apply downstream
#
# Order matters: parsers are tried top-down, first match wins. If no
# parser matches, events fall back to the smtp_generic profile.
mail_parsers:
  - name: checkmk
    match:
      subject_prefix: "Check_MK: "
    profile: checkmk
    extract:
      # Body labeled fields - Host:, Alias:, Address:, Service:, Event:,
      # Output:, Perfdata:. Service: is absent for host-level events;
      # missing labels just produce empty attributes (no error).
      - type: from_body_kvline
        label: "Host"
        attribute: host
      - type: from_body_kvline
        label: "Alias"
        attribute: alias
      - type: from_body_kvline
        label: "Address"
        attribute: address
      - type: from_body_kvline
        label: "Service"
        attribute: service
      - type: from_body_kvline
        label: "Event"
        attribute: event_raw
      - type: from_body_kvline
        label: "Output"
        attribute: output
      - type: from_body_after_label
        label: "Perfdata"
        attribute: perfdata

      # Email headers
      - type: from_header
        header: "Message-Id"
        attribute: message_id
      - type: from_header
        header: "Date"
        attribute: email_date

      # Dispatch on the Event field. Two formats observed:
      #   Path A: "OK -> CRIT"           (state transition)
      #   Path B: "Acknowledged (CRIT)"  (lifecycle event)
      # First-match-wins; only one alternative will populate captures.
      - type: dispatch_first_match
        alternatives:
          - type: from_attribute_regex
            source: event_raw
            pattern: '^(?P<previous_state>\w+)\s+->\s+(?P<state>\w+)\s*$'
          - type: from_attribute_regex
            source: event_raw
            pattern: '^(?P<event_kind>.+?)\s+\((?P<state>\w+)\)\s*$'

      # Computed: type (service or host) - presence of Service: line.
      - type: from_template
        attribute: type
        template: '{{ if .service }}service{{ else }}host{{ end }}'

      # Computed: notiftype - mirrors the values the existing Webex
      # template branches on (PROBLEM, RECOVERY, ACKNOWLEDGEMENT, etc).
      - type: from_template
        attribute: notiftype
        template: '{{ if .event_kind }}{{ if eq .event_kind "Acknowledged" }}ACKNOWLEDGEMENT{{ else if eq .event_kind "Downtime Start" }}DOWNTIMESTART{{ else if eq .event_kind "Downtime End" }}DOWNTIMEEND{{ else if eq .event_kind "Flapping Start" }}FLAPPINGSTART{{ else if eq .event_kind "Flapping Stop" }}FLAPPINGSTOP{{ else }}{{ .event_kind | upper }}{{ end }}{{ else if or (eq .state "OK") (eq .state "UP") }}RECOVERY{{ else }}PROBLEM{{ end }}'

profiles:
  nagios:
    entity:
      from_json: "$.host"
    normalize:
      topic: "nagios-{{.json.type}}-{{.json.state | lower}}"
      urgency:
        from_json: "$.state"
        map:
          OK: info
          UP: info
          WARNING: medium
          CRITICAL: critical
          DOWN: high
          UNREACHABLE: high
    attributes:
      msg:
        from_json: "$.output"
      service:
        from_json: "$.service"
      state:
        from_json: "$.state"
      type:
        from_json: "$.type"
      notiftype:
        from_json: "$.notificationtype"
      author:
        from_json: "$.notificationauthor"
      comment:
        from_json: "$.notificationcomment"
      source_kind:
        static: "nagios"

  generic:
    entity:
      from_json: "$.entity"

  smtp_generic:
    entity:
      from_field: "from_address"
    normalize:
      topic: "smtp"
      urgency:
        from_field: "urgency_default"
    attributes:
      msg:
        from_field: "body"
      subject:
        from_field: "subject"
      from_address:
        from_field: "from_address"
      to_address:
        from_field: "to_address"
      message_id:
        from_field: "message_id"
      received_from_ip:
        from_field: "received_from_ip"
      source_kind:
        static: "smtp"

  # checkmk - structured profile for events parsed from CheckMK email
  # notifications. Driven by the mail_parsers.checkmk parser config above.
  # Produces well-shaped events compatible with the Webex template's
  # notiftype branching (PROBLEM, RECOVERY, ACKNOWLEDGEMENT, etc.).
  checkmk:
    entity:
      from_field: "host"
    normalize:
      topic: "checkmk-{{.Attributes.type}}-{{.Attributes.state | lower}}"
      urgency:
        from_field: "state"
        map:
          OK: info
          UP: info
          WARN: medium
          CRIT: critical
          DOWN: high
          UNREACHABLE: high
          UNKNOWN: low
    attributes:
      msg:
        from_field: "output"
      service:
        from_field: "service"
      state:
        from_field: "state"
      previous_state:
        from_field: "previous_state"
      type:
        from_field: "type"
      notiftype:
        from_field: "notiftype"
      perfdata:
        from_field: "perfdata"
      address:
        from_field: "address"
      source_kind:
        static: "checkmk"

# source_aliases - origin_id -> friendly name map.
#
# Each event's origin_id attribute (set by the receiver) is looked up
# here. If matched, origin_alias is set to the friendly value, which
# templates display in preference to the raw origin_id.
#
# Find your environment's origin_id values:
#   docker exec notrouter tail -50 /var/log/notrouter/audit.jsonl | \
#     python3 -c 'import sys,json; seen=set()
#     for l in sys.stdin:
#       e=json.loads(l); o=e.get("attributes",{}).get("origin_id","")
#       if o and o not in seen:
#         seen.add(o); print(f"{o:40s} via {e.get(\"source\",\"\")}")'
#
# Origin_id formats by receiver type:
#   - SMTP:    full From: email (e.g. "cmk@2f4aa25ce51e")
#   - webhook: sender IP, port-stripped (e.g. "10.21.146.46")
#   - syslog:  sender IP
source_aliases:
  # ----- Synthetic test traffic -----

  # Test_all_event_types.py script's synthetic CheckMK emails
  "cmk@test-checkmk":   "checkmk-test-script"

  # ----- Real CheckMK in docker -----

  # The 2f4aa25ce51e value is the docker container's auto-assigned
  # hostname. WILL CHANGE when the container is recreated. Update
  # this when you spin up a new CheckMK container instance.
  "cmk@2f4aa25ce51e":   "checkmk-dev"

  # ----- Local + container-internal -----

  # Loopback - shows up when curl-ing webhooks from inside the
  # notrouter container itself (make smoke-* targets, manual tests).
  "127.0.0.1":          "localhost"

  # Docker default bridge gateway - webhook events from sibling
  # containers on the default bridge come from this address. If your
  # compose uses a custom network, the gateway IP will differ.
  "172.17.0.1":         "docker-bridge"

  # ----- Add as new senders come online -----
  # "10.21.146.46":     "nagios-prod"
  # "10.21.146.50":     "syslog-firewall-1"

dedup:
  ttl: 5m
  key_fields: [entity, topic]

suppressors:
  - name: ignore-test-hosts
    match:
      entity_regex: "^test-.*"

logging:
  level: info
  suppressor_log_throttle: 60s

plugin_instances:
  webex_noc:
    type: webex
    config:
      webhook_url: "https://webexapis.com/v1/webhooks/incoming/REPLACE_ME"
      timeout: "15s"
      rate_limit_grace: "2s"
    retry:
      attempts: 5
      backoff: [2s, 5s, 10s, 30s, 60s]

  file_audit:
    type: file
    config:
      path: /var/log/notrouter/audit.jsonl

groups:
  audit-only:
    subscribers: [file_audit]
  webex-channel:
    subscribers: [webex_noc]

routing:
  # Everyone gets audited regardless of source
  - match: {}
    groups: [audit-only]

  # Webex destinations - whitelist topics that produce well-shaped events.
  # CheckMK topics added in v0.3.1 once the parser produces structured
  # events. SMTP fallback (topic=smtp) intentionally NOT in this list -
  # those events are unstructured and won't render well via the Webex
  # template.
  - match:
      topic:
        # nagios webhook events
        - "nagios-host-down"
        - "nagios-host-up"
        - "nagios-host-unreachable"
        - "nagios-service-ok"
        - "nagios-service-warning"
        - "nagios-service-critical"
        - "nagios-service-unknown"
        # checkmk SMTP events (parsed via mail_parsers.checkmk)
        - "checkmk-service-ok"
        - "checkmk-service-warn"
        - "checkmk-service-crit"
        - "checkmk-service-unknown"
        - "checkmk-host-up"
        - "checkmk-host-down"
        - "checkmk-host-unreachable"
        # checkmk lifecycle events (acknowledgement, downtime)
        # Topic format for ACK/DOWNTIME uses the state-in-parens as the
        # state attribute, so e.g. ACK on a CRIT service produces:
        #   topic = "checkmk-service-crit"
        # Already covered above. Same applies to Downtime Start/End -
        # they emit topics matching their current state, not separate
        # acknowledgement-* or downtime-* topics.
    groups: [webex-channel]

dispatch:
  global_delivery_ttl: 30m
  default_retry:
    attempts: 3
    backoff: [1s, 5s, 30s]

pipeline:
  raw_buffer_size: 4096
  normal_buffer_size: 2048
  instance_buffer_size: 1024
  resolver_workers: 4
  normalizer_workers: 4
