listen:
  webhook: ":8080"
  syslog_udp: ":5514"
  syslog_tcp: ":5514"
  admin: ":9090"

links:
  grafana: "https://grafana.example.com/d/abc/notrouter"
  runbook: ""
  github: ""

auth:
  admin:
    # Username for legacy basic auth on /admin/state, /admin/deliveries,
    # /admin/dedup/clear. The web UI password is managed in creds_path.
    username: admin

    # Persisted credentials file. First run seeds it with admin/admin and
    # MustChange=true; the UI forces a password rotation on first login.
    # OIDC client config will land here in a future iteration.
    creds_path: /var/lib/notrouter/creds.json

    # Web UI session length. After this, users must log in again.
    session_ttl: 2h

receivers:
  webhook:
    endpoints:
      - path: /webhook/nagios
        profile: nagios
      - path: /webhook/generic
        profile: generic
  syslog:
    early_filter:
      enabled: false
      case_insensitive: false       # default; firewall codes are case-stable
      log_interval: 10m             # optional; defaults to 10min
      include_patterns:
        # Order matters - put high-volume patterns FIRST. Match returns
        # on first hit. After the first 10-min summary, re-order by hit
        # count so the cheapest patterns short-circuit early.
        - "Failed login"
  smtp:
    port_25:
      enabled: true
      listen: ":2525"
      hostname: "notrouter.local"
      allowed_ips:
        - "127.0.0.1/32"        # loopback
        - "172.16.0.0/12"       # private range
        - "10.0.0.0/8"          # private range
        - "192.168.0.0/16"      # private range
      allowed_rcpt_to:
        - "alerts@notrouter.local"
      allowed_from: []
      max_message_bytes: 1048576

profiles:
  nagios:
    entity:
      from_json: "$.host"
    normalize:
      topic: "nagios-{{.json.type}}-{{.json.state | lower}}"
      urgency:
        from_json: "$.state"
        map:
          OK: info
          UP: info
          WARNING: medium
          CRITICAL: critical
          DOWN: high
          UNREACHABLE: high
    attributes:
      msg:
        from_json: "$.output"
      service:
        from_json: "$.service"
      source_kind:
        static: "nagios"

  generic:
    entity:
      from_json: "$.entity"

  smtp_generic:
    entity:
      from_field: "from_address"
    normalize:
      topic: "smtp"
      urgency:
        from_field: "urgency_default"
    attributes:
      msg:
        from_field: "body"
      subject:
        from_field: "subject"
      from_address:
        from_field: "from_address"
      to_address:
        from_field: "to_address"
      message_id:
        from_field: "message_id"
      received_from_ip:
        from_field: "received_from_ip"
      source_kind:
        static: "smtp"

dedup:
  ttl: 5m
  key_fields: [entity, topic]

suppressors:
  - name: ignore-test-hosts
    match:
      entity_regex: "^test-.*"

logging:
  level: info
  suppressor_log_throttle: 60s

plugin_instances:
  webex_noc:
    type: webex
    config:
      webhook_url: "https://webexapis.com/v1/webhooks/incoming/REPLACE_ME"
      timeout: "15s"
      rate_limit_grace: "2s"
    retry:
      attempts: 5
      backoff: [2s, 5s, 10s, 30s, 60s]

  file_audit:
    type: file
    config:
      path: /var/log/notrouter/audit.jsonl

groups:
  audit-only:
    subscribers: [file_audit]
  webex-channel:
    subscribers: [webex_noc]

routing:
  # Everyone gets audited regardless of source
  - match: {}
    groups: [audit-only]

  # Only nagios-* topics get sent to Webex (matches your existing nagios profile output)
  - match:
      topic:
        - "nagios-host-down"
        - "nagios-host-up"
        - "nagios-host-unreachable"
        - "nagios-service-ok"
        - "nagios-service-warning"
        - "nagios-service-critical"
        - "nagios-service-unknown"
    groups: [webex-channel]

dispatch:
  global_delivery_ttl: 30m
  default_retry:
    attempts: 3
    backoff: [1s, 5s, 30s]

pipeline:
  raw_buffer_size: 4096
  normal_buffer_size: 2048
  instance_buffer_size: 1024
  resolver_workers: 4
  normalizer_workers: 4
