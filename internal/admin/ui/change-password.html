<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>notrouter // change password</title>
  <link rel="stylesheet" href="/admin/ui/static/style.css">
</head>
<body class="login-page">
  <div class="terminal">
    <div class="terminal-header">
      <h1>change password</h1>
      <div class="prompt-line">// {{ .User }}@notrouter_</div>
    </div>

    {{ if .MustChange }}
      <div class="notice">default password in use - rotation required</div>
    {{ end }}
    {{ if .Error }}<div class="error">{{ .Error }}</div>{{ end }}
    {{ if .Success }}<div class="success">{{ .Success }}</div>{{ end }}

    <form method="POST" action="/admin/api/change-password">
      <input type="hidden" name="csrf" value="{{ .CSRF }}">

      <label for="current">current password</label>
      <input type="password" id="current" name="current" autocomplete="current-password" required>

      <label for="new1">new password (min 8 chars)</label>
      <input type="password" id="new1" name="new1" autocomplete="new-password" required minlength="8">

      <label for="new2">confirm new password</label>
      <input type="password" id="new2" name="new2" autocomplete="new-password" required minlength="8">

      <button type="submit" class="full">commit</button>
    </form>

    {{ if not .MustChange }}
      <div class="footer">
        <a href="/admin/ui/" style="color: #007a1f; text-decoration: none;">&laquo; back to dashboard</a>
      </div>
    {{ end }}
  </div>
</body>
</html>
